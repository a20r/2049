<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#07020f">
  <!-- Applies the saved theme before first paint; the game owns it from then on. -->
  <script>try{var t=localStorage.getItem('nexus2049.theme');document.documentElement.setAttribute('data-theme',t==='classic'||t==='night'?t:'neon')}catch(e){}</script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="2049: a Blade Runner themed 2048, plus Collatz, daily and endless modes where equal tiles follow 3n+1 or n/2. Rust and WebAssembly.">
  <title>2049</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=7">
  <link rel="modulepreload" href="pkg/nexus2049.js?v=7">
</head>
<body>
  <div class="rain" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <main class="app">
    <header class="hud">
      <div class="title-block">
        <h1 class="title" data-text="2049">2049</h1>
        <p class="tagline" id="tagline">MORE HUMAN THAN HUMAN</p>
      </div>
      <div class="scores">
        <div class="score-box">
          <span class="score-label" id="score-label">SCORE</span>
          <span class="score-value" id="score">0</span>
          <span class="score-delta" id="score-delta"></span>
        </div>
        <div class="score-box">
          <span class="score-label" id="best-label">BEST</span>
          <span class="score-value" id="best">0</span>
        </div>
      </div>
    </header>

    <section class="controls">
      <button class="btn" id="undo" type="button" aria-label="Undo last move">UNDO</button>
      <p class="status-line" id="status-line">SWIPE OR USE ARROW KEYS</p>
      <button class="btn btn-primary" id="new-game" type="button">NEW RUN</button>
    </section>

    <section class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="2049 game board">
        <div class="cells" aria-hidden="true">
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        </div>
        <div class="tiles" id="tiles"></div>

        <div class="overlay" id="overlay" hidden>
          <p class="overlay-kicker" id="overlay-kicker"></p>
          <h2 class="overlay-title" id="overlay-title"></h2>
          <p class="overlay-sub" id="overlay-sub"></p>
          <div class="overlay-actions">
            <button class="btn" id="overlay-secondary" type="button" hidden>KEEP GOING</button>
            <button class="btn" id="overlay-alt" type="button" hidden>NEW BOARD</button>
            <button class="btn btn-primary" id="overlay-primary" type="button">NEW RUN</button>
          </div>
        </div>
      </div>
    </section>

    <footer class="foot">
      <p class="sr-only" id="status" aria-live="polite"></p>
      <div class="foot-switches">
        <div class="seg seg-modes" role="radiogroup" aria-label="Game mode">
          <button class="seg-btn" id="mode-2048" type="button" role="radio" aria-checked="true">2048</button>
          <button class="seg-btn" id="mode-collatz" type="button" role="radio" aria-checked="false">COLLATZ</button>
          <button class="seg-btn daily" id="mode-daily" type="button" role="radio" aria-checked="false">DAILY</button>
          <button class="seg-btn endless" id="mode-endless" type="button" role="radio" aria-checked="false">ENDLESS</button>
        </div>
        <div class="seg seg-theme" role="radiogroup" aria-label="Theme">
          <button class="seg-btn" id="theme-neon" type="button" role="radio" aria-checked="true">NEON</button>
          <button class="seg-btn" id="theme-classic" type="button" role="radio" aria-checked="false">CLASSIC</button>
          <button class="seg-btn" id="theme-night" type="button" role="radio" aria-checked="false">NIGHT</button>
        </div>
      </div>
      <p class="foot-line">TYRELL CORP. &middot; NEXUS SERIES &middot; LOS ANGELES 2049</p>
    </footer>
  </main>

  <script type="module">
    import init, * as nexus from './pkg/nexus2049.js?v=7';
    window.Nexus = nexus;
    init().catch(function (e) { console.error('2049 failed to start', e); });
  </script>
</body>
</html>
